<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CybeLink-5 | Official Developer Portal</title>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #9d50bb;
            --overlay: rgba(10, 10, 15, 0.85); /* 深色遮罩，确保文字清晰 */
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            overflow: hidden; /* 防止背景滚动 */
        }

        /* 全屏背景图层 */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 引用你上传到仓库的 bg.jpg */
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -2;
        }

        /* 半透明遮罩层：增加赛博朋克深色质感 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 20%, var(--overlay) 80%),
                        linear-gradient(0deg, var(--overlay) 0%, rgba(10, 10, 15, 0.4) 100%);
            z-index: -1;
        }

        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            max-width: 550px;
            width: 85%;
            padding: 40px;
            background: rgba(20, 20, 25, 0.7);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 20px;
            backdrop-filter: blur(8px); /* 磨砂玻璃效果 */
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        h1 {
            font-size: 2.5em;
            margin: 0;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .tagline {
            color: #aaa;
            margin: 10px 0 30px 0;
            font-size: 1em;
            text-transform: uppercase;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #eee;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: 600;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn:hover {
            border-color: var(--neon-blue);
            background: rgba(0, 210, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            transform: translateY(-2px);
        }

        .info-box {
            margin-top: 30px;
            font-size: 0.85em;
            color: #888;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        .highlight { color: var(--neon-blue); }
    </style>
</head>
<body>

    <div class="background-container"></div>
    <div class="overlay"></div>

    <div class="main-content">
        <div class="container">
            <h1>CybeLink-5</h1>
            <p class="tagline">Official Developer Portal</p>

            <div class="nav-grid">
                <a href="LEGAL" class="btn">Legal Declaration</a>
                <a href="TOS" class="btn">Terms of Service (TOS)</a>
                <a href="PRIVACY" class="btn">Privacy Policy</a>
                <a href="EULA" class="btn">License (EULA)</a>
            </div>

            <div class="info-box">
                <p>Advanced AI Gomoku on <span class="highlight">Solana Blockchain</span></p>
                <p>Support: 1148965663@qq.com</p>
            </div>
        </div>
    </div>

</body>
</html>
